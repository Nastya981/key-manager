version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: key-manager-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - key-network

  api:
    build: .
    container_name: key-manager-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://admin:admin123@mongodb:27017/
      - MONGODB_DB_NAME=key_manager
      - SECRET_KEY=change-me-to-a-very-secret-key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - mongodb
    volumes:
      - ./app:/app/app
    networks:
      - key-network

volumes:
  mongodb_data:

networks:
  key-network:
    driver: bridge